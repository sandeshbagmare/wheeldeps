[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wheeldeps"
version = "0.1.0"
description = "Read the dependencies of a set of wheels offline, with marker evaluation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sandesh Bagmare" }]
keywords = ["wheel", "packaging", "dependencies", "offline", "metadata", "pip"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
wheeldeps = "wheeldeps.__main__:main"

[project.urls]
Homepage = "https://github.com/sandeshbagmare/wheeldeps"
Issues = "https://github.com/sandeshbagmare/wheeldeps/issues"
Changelog = "https://github.com/sandeshbagmare/wheeldeps/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/wheeldeps"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "-q --doctest-modules"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
